name = "picvibz-images"
main = "worker-images.js"
compatibility_date = "2024-08-24"
compatibility_flags = ["nodejs_compat"]

[vars]
R2_PUBLIC_URL = "https://picvibz.r2.dev"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "picvibz"
preview_bucket_name = "picvibz"

[env.production]
name = "picvibz-images"