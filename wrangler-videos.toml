name = "picvibz-videos"
main = "worker-videos.js"
compatibility_date = "2024-08-24"
compatibility_flags = ["nodejs_compat"]

[vars]
R2_PUBLIC_URL = "https://picvibz.r2.dev"
NESTJS_INTERNAL_URL = "https://api.picvibz.com"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "picvibz"
preview_bucket_name = "picvibz"

[[queues.consumers]]
queue = "video-processing"
max_batch_size = 1
max_batch_timeout = 30

[env.production]
name = "picvibz-videos"