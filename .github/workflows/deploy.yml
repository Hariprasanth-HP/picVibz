name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================================
  # DEPLOY NODE.JS API TO EC2
  # ============================================================
  deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Load ENV_FILE
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE_CONTENT" > .env

          set -a
          source .env
          set +a

          echo "EC2_HOST=$EC2_HOST" >> "$GITHUB_ENV"
          echo "EC2_USER=$EC2_USER" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd ~/picVibz

            # Make Git use the deploy key on EC2
            git config --local core.sshCommand \
              "ssh -i ~/.ssh/github_deploy -o IdentitiesOnly=yes"

            # Get latest code FIRST (before cleanup)
            echo "Fetching latest code..."
            git fetch origin main || { echo "Git fetch failed - check deploy key"; exit 1; }
            git reset --hard origin/main

            # Verify clean state
            echo "Git status:"
            git status
            echo "Source directories:"
            ls -la src/processors/ src/queues/ src/workers/ 2>/dev/null || echo "Directories don't exist (expected)"

            # Cleanup build artifacts
            rm -rf node_modules
            rm -rf dist

            # Clear Docker builder cache
            echo "Clearing Docker builder cache..."
            sudo docker builder prune -a -f

            # Rebuild and restart API (no cache to pick up deleted files)
            sudo docker compose build --no-cache
            sudo docker compose up -d

  # ============================================================
  # DEPLOY CLOUDFLARE WORKER
  # ============================================================
  deploy-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load ENV_FILE
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE_CONTENT" > .env

          set -a
          source .env
          set +a

          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "IMAGE_SIGNING_SECRET=$IMAGE_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wrangler
        run: pnpm add --global wrangler

      - name: Check Wrangler
        run: wrangler --version

      - name: Set Worker secret
        run: |
          printf '%s' "$IMAGE_SIGNING_SECRET" | \
            wrangler secret put IMAGE_SIGNING_SECRET \
            --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: |
          wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}