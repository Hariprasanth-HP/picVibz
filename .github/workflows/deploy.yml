name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================================
  # DEPLOY NODE.JS API TO EC2
  # ============================================================
  deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Load ENV_FILE
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE_CONTENT" > .env

          set -a
          source .env
          set +a

          echo "EC2_HOST=$EC2_HOST" >> "$GITHUB_ENV"
          echo "EC2_USER=$EC2_USER" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd ~/picVibz

            # Make Git use the deploy key on EC2
            git config --local core.sshCommand \
              "ssh -i ~/.ssh/github_deploy -o IdentitiesOnly=yes"

            # Get latest code FIRST
            echo "Fetching latest code..."
            git fetch origin main || { echo "ERROR: Git fetch failed - check deploy key permissions"; exit 1; }
            git reset --hard origin/main
            git clean -fd  # Remove untracked files and directories

            # Verify clean state - fail if any issues
            echo "Verifying git state..."
            git status --porcelain | grep -q . && { echo "ERROR: Working tree not clean"; exit 1; }
            
            # Verify deleted files are actually gone
            test ! -f src/worker.ts || { echo "ERROR: src/worker.ts still exists!"; exit 1; }
            test ! -d src/workers || { echo "ERROR: src/workers/ still exists!"; exit 1; }
            test ! -d src/queues || { echo "ERROR: src/queues/ still exists!"; exit 1; }
            test ! -d src/processors || { echo "ERROR: src/processors/ still exists!"; exit 1; }

            # Verify commit matches origin/main
            CURRENT_COMMIT=$(git rev-parse HEAD)
            EXPECTED_COMMIT=$(git ls-remote origin main | cut -f1)
            [ "$CURRENT_COMMIT" = "$EXPECTED_COMMIT" ] || { echo "ERROR: Commit mismatch! Current=$CURRENT_COMMIT Expected=$EXPECTED_COMMIT"; exit 1; }

            # Debug output
            echo "Git status: OK"
            echo "Current commit: $(git rev-parse HEAD)"
            echo "Source directories verified deleted"

            # Cleanup build artifacts
            rm -rf node_modules
            rm -rf dist

            # Clear Docker builder cache
            echo "Clearing Docker builder cache..."
            sudo docker builder prune -a -f

            # Rebuild and restart API
            sudo docker compose build --no-cache
            sudo docker compose up -d

  # ============================================================
  # DEPLOY CLOUDFLARE WORKER
  # ============================================================
  deploy-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load ENV_FILE
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE_CONTENT" > .env

          set -a
          source .env
          set +a

          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "IMAGE_SIGNING_SECRET=$IMAGE_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wrangler
        run: pnpm add --global wrangler

      - name: Check Wrangler
        run: wrangler --version

      - name: Set Worker secret
        run: |
          printf '%s' "$IMAGE_SIGNING_SECRET" | \
            wrangler secret put IMAGE_SIGNING_SECRET \
            --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: |
          wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}