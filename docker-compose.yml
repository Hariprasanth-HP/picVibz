services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: picvibz
      POSTGRES_PASSWORD: picvibz
      POSTGRES_DB: picvibz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picvibz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    command: node dist/main.js
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://picvibz:picvibz@postgres:5432/picvibz
      DIRECT_URL: postgresql://picvibz:picvibz@postgres:5432/picvibz
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"

  worker:
    build: .
    restart: unless-stopped
    command: node dist/worker.js
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://picvibz:picvibz@postgres:5432/picvibz
      DIRECT_URL: postgresql://picvibz:picvibz@postgres:5432/picvibz
      REDIS_URL: redis://redis:6379
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-3}

volumes:
  redis-data:
  postgres-data: